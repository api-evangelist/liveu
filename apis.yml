aid: liveu
name: Liveu
description: >-
  LiveU is a provider of cloud-based, IP-bonded live video contribution, production, and distribution
  technology for broadcasters, sports, news, public safety, and enterprise. Its portfolio spans field
  encoders (the LU-series and the Q Era LU900Q), the LiveU Central cloud management platform, LiveU
  Studio and Nexus production tools, the LiveU Matrix distribution grid, DataBridge and LU-LINK
  connectivity, and the LiveU Solo streaming line. LiveU pioneered bonded-cellular transmission that
  aggregates multiple LTE/5G, Wi-Fi, and satellite links into a single reliable, low-latency video feed.
  This profile was surfaced as a venture-capital portfolio company and enriched by the API Evangelist
  pipeline; LiveU publishes marketing, support, and training surfaces but no public developer portal,
  OpenAPI, or open API documentation was found - the LiveU Central API is available to customers behind
  authentication.
